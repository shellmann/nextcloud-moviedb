name: Bug report
description: Something in MovieDB doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the [open issues](https://github.com/shellmann/nextcloud-moviedb/issues) first, someone may have reported it already.

        **Security vulnerabilities do not belong here.** Please report them privately, see [SECURITY.md](https://github.com/shellmann/nextcloud-moviedb/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: moviedb-version
    attributes:
      label: MovieDB version
      description: Shown in Nextcloud under Apps → Your apps.
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud version
      placeholder: "33.0.2"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MySQL / MariaDB
        - PostgreSQL
        - SQLite
        - I don't know
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: For problems in the web interface.
      placeholder: "Firefox 140"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from the browser console or from `nextcloud.log` (Administration settings → Logging). Please remove any personal data and API keys.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If they help to show the problem, drag them in here.
