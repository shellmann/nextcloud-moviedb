name: Upgrade check

on:
  push:
    branches: [main]
  # Every PR, whatever its base branch, so stacked PRs get CI too.
  pull_request:

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade from ${{ matrix.from }} (${{ matrix.db }})${{ matrix.nc && format(' on Nextcloud {0}', matrix.nc) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # v1.5.2 is the last release before PR #45 edited released migrations;
        # "latest" is the newest v* tag (the normal upgrade path).
        from: [v1.5.2, latest]
        db: [sqlite, mysql, pgsql]
        # The default image is the newest supported Nextcloud (35). The oldest
        # supported release (33) gets its own jobs, so a core difference there
        # (e.g. the calendar provider) is caught before a release.
        include:
          - from: latest
            db: sqlite
            nc: 33
          - from: latest
            db: pgsql
            nc: 33
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the old release is read from its tag
      - name: Upgrade, check the schema and smoke-test the API
        env:
          FROM_REF: ${{ matrix.from }}
          DB_KIND: ${{ matrix.db }}
          NC_IMAGE: nextcloud:${{ matrix.nc || 35 }}
        run: tests/upgrade/check-upgrade.sh "$FROM_REF" "$DB_KIND"
